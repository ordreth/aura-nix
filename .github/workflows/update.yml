name: Follow Aura releases

# Once a day: read Aura's signed update manifest, and when it names a newer version than sources.json,
# open a pull request that points the flake at it. The manifest's signature is checked with
# aura-update.pub (the public key Aura itself is built with) and the .deb's SHA-256 with the manifest, so
# nothing from the site is trusted on its own. The maintainer builds and runs the pull request
# (`nix build .#aura`) before merging.
#
# Needs "Allow GitHub Actions to create and approve pull requests" in the repository's Actions settings.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: follow-aura
  cancel-in-progress: false

jobs:
  follow:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The public key is set
        id: key
        run: |
          if grep -q PLACEHOLDER aura-update.pub; then
            echo "aura-update.pub is still the placeholder: nothing to follow yet."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read the signed manifest
        id: manifest
        if: steps.key.outputs.ready == 'true'
        env:
          LC_ALL: C
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y -qq minisign jq
          base="https://ordreth.com/apps/aura/updates"
          # Before the first signed release the site has no manifest: nothing to follow, not a failure.
          status="$(curl --silent --show-error --location --proto '=https' --max-filesize 65536 \
            --output latest.json --write-out '%{http_code}' "$base/latest.json")"
          if [ "$status" = "404" ]; then
            echo "The site has no update manifest yet: nothing to do."
            echo "newer=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$status" = "200" ] || { echo "The manifest answered HTTP $status" >&2; exit 1; }
          curl --fail --silent --show-error --location --proto '=https' --max-filesize 4096 \
            --output latest.json.minisig "$base/latest.json.minisig"
          minisign -V -q -p aura-update.pub -m latest.json -x latest.json.minisig
          grep -qx 'trusted comment: aura-update-manifest' latest.json.minisig

          version="$(jq -er '.version' latest.json)"
          name="$(jq -er '.files["linux-x86_64-deb"].name' latest.json)"
          sha256="$(jq -er '.files["linux-x86_64-deb"].sha256' latest.json)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "bad version: $version" >&2; exit 1; }
          [[ "$name" == "Aura_${version}_amd64.deb" ]] || { echo "unexpected file name: $name" >&2; exit 1; }
          [[ "$sha256" =~ ^[0-9a-f]{64}$ ]] || { echo "bad SHA-256: $sha256" >&2; exit 1; }

          current="$(jq -er '.version' sources.json)"
          newest="$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -n1)"
          if [ "$version" = "$current" ] || [ "$newest" != "$version" ]; then
            echo "sources.json has $current; the site has $version: nothing to do."
            echo "newer=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "newer=true"
            echo "version=$version"
            echo "sha256=$sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Open the pull request
        if: steps.manifest.outputs.newer == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.manifest.outputs.version }}
          SHA256: ${{ steps.manifest.outputs.sha256 }}
        run: |
          set -euo pipefail
          branch="update/aura-$VERSION"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "$branch already exists: the pull request is open or was handled."
            exit 0
          fi
          # The .deb the flake will fetch is the one the signed manifest describes.
          curl --fail --silent --show-error --location --proto '=https' --output aura.deb \
            "https://ordreth.com/apps/aura/downloads/Aura_${VERSION}_amd64.deb"
          echo "$SHA256  aura.deb" | sha256sum --check --quiet
          rm aura.deb latest.json latest.json.minisig

          ./update.sh "$VERSION" "$SHA256"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "chore: Aura $VERSION"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Aura $VERSION" --body \
            "The signed update manifest on ordreth.com names Aura $VERSION. Its signature verified with aura-update.pub and the .deb matches its SHA-256 ($SHA256).

          Before merging: \`nix build .#aura && ./result/bin/aura-player\` (rows N9 to N12 of Aura's QA list). Merge from a computer, not with the button: \`git switch main && git merge --ff-only origin/$branch && git push origin main\`."
